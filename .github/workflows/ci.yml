name: CI Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

        # For reasons som jag inte kan förklara använder detta projekt pnpm och inte npm! Det bara blev så
        # i början av projektet och jag antar att det är nyttig erfarenhet att ha testat båda. Om jag förstår
        # rätt är enda skillnaden hur node_modules lagras och hanteras. Vi *skulle* kunna ändra till npm nu i
        # retrospekt men det finns ingen riktig anledning till att göra det. Vi kör på med pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Lint Code
        run: pnpm run lint

      - name: Build
        run: pnpm run build
